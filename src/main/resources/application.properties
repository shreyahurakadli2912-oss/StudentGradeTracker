# Application Configuration
spring.application.name=student-grade-tracker
server.port=${PORT:8080}

# Database Configuration (Defaults to H2 database engine)
spring.datasource.url=${DB_URL:jdbc:h2:mem:gradetracker;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Enabled for debugging at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart Upload Limits (Bulk CSV/Excel/PDF Uploads)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Static Web Resources Routing
spring.web.resources.static-locations=classpath:/static/,file:web/
